<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channels — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><span class="logo-mark"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg></span>AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="/channels.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 8l4 4-4 4V8z" fill="currentColor" stroke="none"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uploads</a>
                <a href="/providers.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3.5"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1>Channels</h1>
                    <div class="page-sub">YouTube channels to monitor for new videos</div>
                </div>
            </div>

            <div class="bento" style="margin-bottom:16px;">
                <div class="card span-4">
                    <div class="card-head"><span class="card-title">Add Channel</span></div>
                    <form onsubmit="addChannel(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Channel URL</label>
                                <input type="url" id="channel-url" placeholder="https://www.youtube.com/@channelname" required>
                            </div>
                            <div class="form-group">
                                <label>Channel Name (optional)</label>
                                <input type="text" id="channel-name" placeholder="My Channel">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                            Add Channel
                        </button>
                    </form>
                </div>
            </div>

            <div class="section-title">Monitored Channels</div>
            <div class="provider-grid" id="channels-grid">
                <div class="empty">Loading...</div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        async function loadChannels() {
            const channels = await apiFetch('/api/channels');
            const grid = document.getElementById('channels-grid');
            if (!channels.length) {
                grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No channels yet — add one above</div>';
                return;
            }
            grid.innerHTML = channels.map(c => `
                <div class="provider-card">
                    <div class="provider-top">
                        <div class="provider-avatar">${(c.channel_name || 'Y')[0].toUpperCase()}</div>
                        <div style="min-width:0;">
                            <div class="provider-name">${c.channel_name || 'Unnamed Channel'}</div>
                            <div class="provider-meta" style="text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;">${c.channel_url.replace('https://','')}</div>
                        </div>
                    </div>
                    <div class="provider-status">
                        <span class="sdot sdot-${c.check_enabled ? 'connected' : 'untested'}"></span>
                        <span>${c.check_enabled ? 'Active' : 'Paused'}</span>
                        <span class="msg">${formatDate(c.last_checked)}</span>
                    </div>
                    <div class="provider-actions">
                        <button class="btn btn-sm btn-secondary" onclick="toggleChannel(${c.id}, ${!c.check_enabled})">${c.check_enabled ? 'Pause' : 'Resume'}</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteChannel(${c.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        async function addChannel(e) {
            e.preventDefault();
            try {
                await apiFetch('/api/channels', { method: 'POST', body: JSON.stringify({ channel_url: document.getElementById('channel-url').value, channel_name: document.getElementById('channel-name').value || null }) });
                showToast('Channel added');
                loadChannels(); e.target.reset();
            } catch (e) { showToast('Failed: ' + e.message, 'error'); }
        }
        async function toggleChannel(id, enabled) { await apiFetch(`/api/channels/${id}`, { method: 'PATCH', body: JSON.stringify({ check_enabled: enabled }) }); loadChannels(); }
        async function deleteChannel(id) { if (!confirm('Delete this channel?')) return; await apiFetch(`/api/channels/${id}`, { method: 'DELETE' }); showToast('Channel deleted'); loadChannels(); }
        loadChannels();
    </script>
</body>
</html>
