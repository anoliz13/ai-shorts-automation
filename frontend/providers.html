<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>Uploads</a>
                <a href="/providers.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1>Providers</h1>
            <div class="card">
                <h3>Add Custom Provider</h3>
                <form onsubmit="addProvider(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Provider Name</label>
                            <input type="text" id="prov-name" placeholder="e.g. OpenRouter, Groq, Ollama" required>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="prov-type">
                                <option value="llm">LLM (Chat Completion)</option>
                                <option value="processing">Video Processing</option>
                                <option value="transcription">Transcription</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>API Key</label>
                            <input type="password" id="prov-key" placeholder="sk-...">
                        </div>
                        <div class="form-group">
                            <label>Model (optional)</label>
                            <input type="text" id="prov-model" placeholder="gpt-4o-mini">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Base URL (optional — for custom endpoints)</label>
                        <input type="url" id="prov-url" placeholder="https://api.openai.com/v1">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Provider</button>
                </form>
            </div>
            <div class="card">
                <h3>Configured Providers</h3>
                <div class="provider-grid" id="providers-grid">
                    <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:24px;">Loading...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        async function loadProviders() {
            const providers = await apiFetch('/api/providers');
            const grid = document.getElementById('providers-grid');
            if (!providers.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:24px;">No providers configured</div>';
                return;
            }
            grid.innerHTML = providers.map(p => `
                <div class="provider-card ${p.is_active ? 'active' : ''}">
                    <div class="provider-header">
                        <span class="provider-name">${p.name}</span>
                        ${p.is_builtin ? '<span class="badge badge-blue">Built-in</span>' : '<span class="badge badge-gray">Custom</span>'}
                    </div>
                    <div class="provider-type">${p.provider_type}${p.model ? ' &middot; ' + p.model : ''}</div>
                    <div class="provider-status">
                        <span class="status-dot ${p.test_status === 'connected' ? 'connected' : p.test_status === 'testing' ? 'testing' : p.test_status === 'disconnected' ? 'disconnected' : 'untested'}"></span>
                        <span style="font-size:13px;color:var(--text-secondary);">${p.test_status === 'connected' ? 'Connected' : p.test_status === 'testing' ? 'Testing...' : p.test_status === 'disconnected' ? 'Disconnected' : 'Not tested'}</span>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${p.test_message || ''}</div>
                    <div class="provider-actions">
                        <button class="btn btn-sm btn-secondary" onclick="testProvider(${p.id})">Test</button>
                        ${!p.is_builtin ? `<button class="btn btn-sm btn-ghost" onclick="toggleProvider(${p.id}, ${!p.is_active})">${p.is_active ? 'Deactivate' : 'Activate'}</button>` : ''}
                        ${!p.is_builtin ? `<button class="btn btn-sm btn-danger" onclick="deleteProvider(${p.id})">Delete</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        async function addProvider(e) {
            e.preventDefault();
            try {
                await apiFetch('/api/providers', { method: 'POST', body: JSON.stringify({ name: document.getElementById('prov-name').value, provider_type: document.getElementById('prov-type').value, api_key: document.getElementById('prov-key').value || null, base_url: document.getElementById('prov-url').value || null, model: document.getElementById('prov-model').value || null }) });
                showToast('Provider added');
                loadProviders(); e.target.reset();
            } catch(e) { showToast('Failed: ' + e.message, 'error'); }
        }
        async function testProvider(id) {
            showToast('Testing connection...', 'info');
            try {
                const r = await apiFetch(`/api/providers/${id}/test`, { method: 'POST' });
                showToast(r.message, r.status === 'connected' ? 'success' : 'error');
                loadProviders();
            } catch(e) { showToast('Test failed: ' + e.message, 'error'); }
        }
        async function toggleProvider(id, active) { await apiFetch(`/api/providers/${id}`, { method: 'PATCH', body: JSON.stringify({ is_active: active }) }); loadProviders(); }
        async function deleteProvider(id) { if (!confirm('Delete this provider?')) return; await apiFetch(`/api/providers/${id}`, { method: 'DELETE' }); showToast('Provider deleted'); loadProviders(); }
        loadProviders();
    </script>
</body>
</html>
