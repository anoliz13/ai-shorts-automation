<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><span class="logo-mark"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg></span>AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 8l4 4-4 4V8z" fill="currentColor" stroke="none"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uploads</a>
                <a href="/providers.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3.5"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1>Providers</h1>
                    <div class="page-sub">API providers for transcription, LLM ranking, and video processing</div>
                </div>
            </div>

            <div class="bento" style="margin-bottom:16px;">
                <div class="card span-4">
                    <div class="card-head"><span class="card-title">Add Custom Provider</span><span class="card-label">OpenAI-compatible</span></div>
                    <form onsubmit="addProvider(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Provider Name</label>
                                <input type="text" id="prov-name" placeholder="OpenRouter, Groq, Ollama…" required>
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <select id="prov-type">
                                    <option value="llm">LLM (Chat Completion)</option>
                                    <option value="processing">Video Processing</option>
                                    <option value="transcription">Transcription</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>API Key</label>
                                <input type="password" id="prov-key" placeholder="sk-…">
                            </div>
                            <div class="form-group">
                                <label>Model</label>
                                <input type="text" id="prov-model" placeholder="gpt-4o-mini">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Base URL (optional — for custom endpoints)</label>
                            <input type="url" id="prov-url" placeholder="https://api.openai.com/v1">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                            Add Provider
                        </button>
                    </form>
                </div>
            </div>

            <div class="section-title">Configured Providers</div>
            <div class="provider-grid" id="providers-grid">
                <div class="empty">Loading...</div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        function statusInfo(p) {
            const map = {
                connected: ['connected', 'Connected'],
                testing: ['testing', 'Testing…'],
                disconnected: ['disconnected', 'Disconnected'],
                untested: ['untested', 'Not tested'],
            };
            return map[p.test_status] || map.untested;
        }
        async function loadProviders() {
            const providers = await apiFetch('/api/providers');
            const grid = document.getElementById('providers-grid');
            if (!providers.length) {
                grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No providers configured</div>';
                return;
            }
            grid.innerHTML = providers.map(p => {
                const [dotCls, label] = statusInfo(p);
                return `
                <div class="provider-card ${p.is_active ? 'active' : ''}">
                    <div class="provider-top">
                        <div class="provider-avatar">${p.name[0].toUpperCase()}</div>
                        <div style="min-width:0;flex:1;">
                            <div class="provider-name">${p.name}</div>
                            <div class="provider-meta"><span class="ptype">${p.provider_type}</span>${p.model ? ' · ' + p.model : ''}</div>
                        </div>
                        ${p.is_builtin ? '<span class="badge badge-violet">Built-in</span>' : '<span class="badge badge-gray">Custom</span>'}
                    </div>
                    <div class="provider-status">
                        <span class="sdot sdot-${dotCls}"></span>
                        <span>${label}</span>
                        <span class="msg" title="${p.test_message || ''}">${p.test_message || ''}</span>
                    </div>
                    <div class="provider-actions">
                        <button class="btn btn-sm btn-primary" onclick="testProvider(${p.id})">Test</button>
                        ${!p.is_builtin ? `<button class="btn btn-sm btn-secondary" onclick="toggleProvider(${p.id}, ${!p.is_active})">${p.is_active ? 'Deactivate' : 'Activate'}</button>` : ''}
                        ${!p.is_builtin ? `<button class="btn btn-sm btn-danger" onclick="deleteProvider(${p.id})">Delete</button>` : ''}
                    </div>
                </div>`;
            }).join('');
        }
        async function addProvider(e) {
            e.preventDefault();
            try {
                await apiFetch('/api/providers', { method: 'POST', body: JSON.stringify({ name: document.getElementById('prov-name').value, provider_type: document.getElementById('prov-type').value, api_key: document.getElementById('prov-key').value || null, base_url: document.getElementById('prov-url').value || null, model: document.getElementById('prov-model').value || null }) });
                showToast('Provider added');
                loadProviders(); e.target.reset();
            } catch (e) { showToast('Failed: ' + e.message, 'error'); }
        }
        async function testProvider(id) {
            showToast('Testing connection…', 'info');
            try {
                const r = await apiFetch(`/api/providers/${id}/test`, { method: 'POST' });
                showToast(r.message, r.status === 'connected' ? 'success' : 'error');
                loadProviders();
            } catch (e) { showToast('Test failed: ' + e.message, 'error'); }
        }
        async function toggleProvider(id, active) { await apiFetch(`/api/providers/${id}`, { method: 'PATCH', body: JSON.stringify({ is_active: active }) }); loadProviders(); }
        async function deleteProvider(id) { if (!confirm('Delete this provider?')) return; await apiFetch(`/api/providers/${id}`, { method: 'DELETE' }); showToast('Provider deleted'); loadProviders(); }
        loadProviders();
    </script>
</body>
</html>
