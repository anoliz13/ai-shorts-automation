<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploads — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><span class="logo-mark"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg></span>AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 8l4 4-4 4V8z" fill="currentColor" stroke="none"/></svg>Shorts</a>
                <a href="/uploads.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uploads</a>
                <a href="/providers.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3.5"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1>Uploads</h1>
                    <div class="page-sub">Delivery history to TikTok and YouTube Shorts</div>
                </div>
            </div>

            <div class="bento" style="margin-bottom:16px;">
                <div class="card span-4">
                    <div class="card-head"><span class="card-title">Daily Usage</span><span class="card-label">Rate Limits</span></div>
                    <div id="usage-bars" class="form-row"></div>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Short</th><th>Platform</th><th>Status</th><th>Uploaded At</th><th>Error</th></tr></thead>
                        <tbody id="uploads-tbody">
                            <tr><td colspan="5" class="empty">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        async function loadUsage() {
            const usage = await apiFetch('/api/uploads/daily-usage');
            const box = document.getElementById('usage-bars');
            const entries = Object.entries(usage);
            if (!entries.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:20px;">No uploads recorded today</div>'; return; }
            box.innerHTML = entries.map(([p, d]) => {
                const pct = d.limit > 0 ? Math.min(100, (d.used / d.limit) * 100) : 0;
                return `<div class="progress-row"><div class="progress-meta"><span class="name">${p}</span><span class="count">${d.used} / ${d.limit}</span></div><div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
            }).join('');
        }
        async function loadUploads() {
            const uploads = await apiFetch('/api/uploads');
            const tbody = document.getElementById('uploads-tbody');
            if (!uploads.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">No uploads yet</td></tr>';
                return;
            }
            tbody.innerHTML = uploads.map(u => `
                <tr>
                    <td style="color:var(--text);font-weight:500;">${u.short_title || 'Untitled'}</td>
                    <td><span class="badge badge-${u.platform === 'youtube' ? 'red' : 'gray'}" style="text-transform:capitalize;">${u.platform}</span></td>
                    <td><span class="badge badge-${u.status === 'done' ? 'green' : u.status === 'failed' ? 'red' : 'yellow'}">${u.status}</span></td>
                    <td>${formatDate(u.uploaded_at)}</td>
                    <td style="font-size:12px;color:var(--danger);max-width:260px;">${u.error_message || '—'}</td>
                </tr>
            `).join('');
        }
        loadUsage();
        loadUploads();
    </script>
</body>
</html>
