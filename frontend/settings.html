<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><span class="logo-mark"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg></span>AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 8l4 4-4 4V8z" fill="currentColor" stroke="none"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uploads</a>
                <a href="/providers.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3.5"/></svg>Providers</a>
                <a href="/settings.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1>Settings</h1>
                    <div class="page-sub">Schedule, anti-spam limits, and generation mode</div>
                </div>
            </div>

            <form onsubmit="saveSettings(event)">
                <div class="bento">
                    <div class="card span-2">
                        <div class="card-head"><span class="card-title">Schedule</span><span class="card-label">Daily</span></div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Check Hour (0-23)</label>
                                <input type="number" id="check_hour" min="0" max="23" value="20">
                            </div>
                            <div class="form-group">
                                <label>Check Minute (0-59)</label>
                                <input type="number" id="check_minute" min="0" max="59" value="0">
                            </div>
                        </div>
                    </div>

                    <div class="card span-2">
                        <div class="card-head"><span class="card-title">Generation</span><span class="card-label">Engine</span></div>
                        <div class="form-group">
                            <label>Shorts Mode</label>
                            <select id="shorts_mode">
                                <option value="api">API (MuAPI — fast, requires key)</option>
                                <option value="local">Local (offline, requires ffmpeg)</option>
                            </select>
                        </div>
                    </div>

                    <div class="card span-4">
                        <div class="card-head"><span class="card-title">Anti-Spam Limits</span><span class="card-label">Throttling</span></div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Max Shorts per Video</label>
                                <input type="number" id="max_shorts_per_video" min="1" max="10" value="5">
                            </div>
                            <div class="form-group">
                                <label>Min Gap Between Uploads (minutes)</label>
                                <input type="number" id="min_gap_minutes" min="5" max="120" value="30">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Max TikTok Uploads / Day</label>
                                <input type="number" id="max_uploads_per_day_tiktok" min="1" max="20" value="5">
                            </div>
                            <div class="form-group">
                                <label>Max YouTube Uploads / Day</label>
                                <input type="number" id="max_uploads_per_day_youtube" min="1" max="20" value="5">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="margin-top:20px;">
                    <button type="submit" class="btn btn-primary">
                        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                        Save Settings
                    </button>
                </div>
            </form>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        async function loadSettings() {
            const s = await apiFetch('/api/settings');
            if (Object.keys(s).length) {
                document.getElementById('check_hour').value = s.check_hour ?? 20;
                document.getElementById('check_minute').value = s.check_minute ?? 0;
                document.getElementById('max_shorts_per_video').value = s.max_shorts_per_video ?? 5;
                document.getElementById('max_uploads_per_day_tiktok').value = s.max_uploads_per_day_tiktok ?? 5;
                document.getElementById('max_uploads_per_day_youtube').value = s.max_uploads_per_day_youtube ?? 5;
                document.getElementById('min_gap_minutes').value = s.min_gap_minutes ?? 30;
                document.getElementById('shorts_mode').value = s.shorts_mode || 'api';
            }
        }
        async function saveSettings(e) {
            e.preventDefault();
            try {
                await apiFetch('/api/settings', { method: 'PUT', body: JSON.stringify({
                    check_hour: +document.getElementById('check_hour').value,
                    check_minute: +document.getElementById('check_minute').value,
                    max_shorts_per_video: +document.getElementById('max_shorts_per_video').value,
                    max_uploads_per_day_tiktok: +document.getElementById('max_uploads_per_day_tiktok').value,
                    max_uploads_per_day_youtube: +document.getElementById('max_uploads_per_day_youtube').value,
                    min_gap_minutes: +document.getElementById('min_gap_minutes').value,
                    shorts_mode: document.getElementById('shorts_mode').value,
                })});
                showToast('Settings saved');
            } catch (e) { showToast('Failed: ' + e.message, 'error'); }
        }
        loadSettings();
    </script>
</body>
</html>
