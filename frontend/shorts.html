<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo"><span class="logo-mark"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg></span>AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Channels</a>
                <a href="/videos.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>Videos</a>
                <a href="/shorts.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 8l4 4-4 4V8z" fill="currentColor" stroke="none"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uploads</a>
                <a href="/providers.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/><circle cx="12" cy="12" r="3.5"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1>Shorts</h1>
                    <div class="page-sub">Generated vertical clips ranked by viral score</div>
                </div>
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterShorts('', this)">All</button>
                <button class="filter-tab" onclick="filterShorts('pending', this)">Pending</button>
                <button class="filter-tab" onclick="filterShorts('uploaded', this)">Uploaded</button>
                <button class="filter-tab" onclick="filterShorts('failed', this)">Failed</button>
            </div>
            <div class="shorts-grid" id="shorts-grid">
                <div class="empty" style="grid-column:1/-1;">Loading...</div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        let allShorts = [];
        async function loadShorts() {
            allShorts = await apiFetch('/api/shorts');
            renderShorts(allShorts);
        }
        function filterShorts(status, el) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderShorts(status ? allShorts.filter(s => s.status === status) : allShorts);
        }
        function scoreColor(s) {
            if (s >= 80) return 'green';
            if (s >= 60) return 'yellow';
            return 'gray';
        }
        function renderShorts(shorts) {
            const grid = document.getElementById('shorts-grid');
            if (!shorts.length) {
                grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">No shorts generated yet</div>';
                return;
            }
            grid.innerHTML = shorts.map(s => `
                <div class="short-card">
                    <div class="short-preview">${s.score || 0}</div>
                    <div class="short-body">
                        <div class="short-title">${s.title || 'Untitled'}</div>
                        <div class="short-hook">${s.hook_sentence || s.video_title || ''}</div>
                        <div class="short-foot">
                            <span class="badge badge-${s.status === 'uploaded' ? 'green' : s.status === 'failed' ? 'red' : s.status === 'uploading' ? 'blue' : 'yellow'}">${s.status}</span>
                            <button class="btn btn-sm btn-primary" onclick="uploadShort(${s.id})">Upload</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        async function uploadShort(id) {
            try { await apiFetch(`/api/shorts/${id}/upload`, { method: 'POST' }); showToast('Upload triggered'); loadShorts(); }
            catch (e) { showToast('Upload failed: ' + e.message, 'error'); }
        }
        loadShorts();
    </script>
</body>
</html>
