<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos — AI Shorts Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">AI<span>Shorts</span></div>
            <nav>
                <a href="/"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
                <a href="/channels.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Channels</a>
                <a href="/videos.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Videos</a>
                <a href="/shorts.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Shorts</a>
                <a href="/uploads.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>Uploads</a>
                <a href="/providers.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Providers</a>
                <a href="/settings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1>Videos</h1>
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="loadVideos('')">All</button>
                <button class="filter-tab" onclick="loadVideos('pending')">Pending</button>
                <button class="filter-tab" onclick="loadVideos('done')">Done</button>
                <button class="filter-tab" onclick="loadVideos('failed')">Failed</button>
            </div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Title</th><th>Status</th><th>Shorts</th><th>Published</th><th>Processed</th></tr></thead>
                        <tbody id="videos-tbody">
                            <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No videos found</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
    <script>
        async function loadVideos(status) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            if (event?.target) event.target.classList.add('active');
            const url = status ? `/api/videos?status=${status}` : '/api/videos';
            const videos = await apiFetch(url);
            const tbody = document.getElementById('videos-tbody');
            if (!videos.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No videos found</td></tr>';
                return;
            }
            tbody.innerHTML = videos.map(v => `
                <tr>
                    <td><a href="${v.video_url}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:500;">${v.video_title || 'Untitled'}</a></td>
                    <td><span class="badge badge-${v.status === 'done' ? 'green' : v.status === 'failed' ? 'red' : v.status === 'processing' ? 'blue' : 'yellow'}">${v.status}</span></td>
                    <td>${v.shorts_count}</td>
                    <td>${formatDate(v.published_at)}</td>
                    <td>${formatDate(v.processed_at)}</td>
                </tr>
            `).join('');
        }
        loadVideos('');
    </script>
</body>
</html>
